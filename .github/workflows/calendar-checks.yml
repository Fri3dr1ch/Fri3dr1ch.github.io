name: Veranstaltungskalender im Pull Request prüfen

on:
  pull_request:
    paths:
      - 'veranstaltungen/**'
      - '.github/workflows/calendar*.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: veranstaltungen
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'veranstaltungen/requirements-import.lock'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 'veranstaltungen/package-lock.json'
      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Import und Kalender prüfen
        run: |
          python -m unittest discover -s tests
          python scripts/validate_calendar.py
          # The recorded source snapshots can legitimately age between production runs.
          # Check that rebuilding them succeeds, regardless of their freshness.
          PYTHONPATH=scripts python -c 'from update_calendar import ROOT, run; run(ROOT, offline=True)'
          python scripts/validate_calendar.py
          npm test
